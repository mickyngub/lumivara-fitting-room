name: Mirror Lumivara's art

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency: mirror

jobs:
  mirror:
    # Runs once the Cloudflare account is set up: repository variables
    # CLOUDFLARE_ACCOUNT_ID and MIRROR_URL, and the secret CLOUDFLARE_API_TOKEN.
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: sync
        run: node mirror/sync.ts
        env:
          MIRROR_URL: ${{ vars.MIRROR_URL }}
      - if: steps.sync.outputs.changed == 'true'
        run: npx -y wrangler@4 deploy --config mirror/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
